{% extends "base_app.html" %}

{% block title %}Password changed — Ennizo{% endblock %}

{% block content %}
<div class="mx-auto w-full max-w-md px-4 py-10">
  <div class="bg-card border-border rounded-2xl border p-8 text-center">
    <div class="bg-primary/15 mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full">
      <svg viewBox="0 0 24 24" class="text-primary h-6 w-6" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
    </div>
    <h1 class="text-lg font-semibold">Password changed</h1>
    <p class="text-muted-foreground mt-1 text-sm">
      Your new password is active. You'll use it next time you sign in.
    </p>
    <a href="{% url 'accounts:settings' %}"
       class="bg-primary hover:bg-primary/90 mt-5 inline-block rounded-xl px-5 py-2.5 text-sm font-semibold text-white transition-colors">
      Back to settings
    </a>
  </div>
</div>
{% endblock %}
