{% extends "base_app.html" %}

{% block content %}
<div class="mx-auto w-full max-w-3xl px-6 py-8">

  <div class="mb-6">
    <h1 class="text-2xl font-semibold">{{ sample.title }}</h1>
    <p class="mt-1 text-sm text-white/50">
      {{ sample.folder.library.user }} · {{ sample.created_at|date:"j M Y" }}
      {% if post and not post.is_published %}
        · <span class="rounded bg-amber-500/15 px-2 py-0.5 text-amber-400">Draft</span>
      {% endif %}
    </p>
  </div>
  
  {% include "analysis/_analysis_state.html" %}

</div>
{% endblock %}
