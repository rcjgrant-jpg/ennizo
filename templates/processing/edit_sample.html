{% extends "base_app.html" %}
{% block content %}

<script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>

  {% include "partials/_waveform.html" with with_media=True %}
 {{ eq_bands|json_script:"eq-bands" }}

  <div id="eq-panel" class="mt-4 rounded-xl border border-white/10 bg-white/5 p-5">
    <div class="flex items-end justify-between gap-2">
     {% for band in eq_bands %}
        <div class="flex flex-col items-center gap-2">
            <input type="range"
                    class="eq-slider"
                    data-band="{{ forloop.counter0 }}"
                    min="-12" max="12" step="0.5" value="0"
                    style="writing-mode: vertical-lr; direction: rtl; height: 8rem;">
            <span class="text-xs text-white/40">
            {% if band >= 1000 %}{{ band|floatformat:0|slice:":-3" }}k{% else %}{{ band }}{% endif %}
            </span>
            </div>
    {% endfor %}
    </div>
  </div>

    <button id="render-button" type="button"
        class="mt-4 bg-primary text-primary-foreground rounded-md px-5 py-2 text-sm font-semibold">
    Confirm edit
    </button>

  <script>

    let trimRegion = null;

    (function () {

        if (!window.ennizoMedia) return;

        const ctx = new AudioContext();
        const source = ctx.createMediaElementSource(window.ennizoMedia)

        const frequencies = JSON.parse(document.getElementById("eq-bands").textContent);
    
        const filters = frequencies.map((freq, index) => {
           const filter = ctx.createBiquadFilter();
           filter.type = "peaking";
           filter.frequency.value = freq;
           filter.Q.value = 1
           filter.gain.value = 0;
           return filter;
        });
        
        source.connect(filters[0]);
        for (let i = 0; i < filters.length - 1; i ++) {
            filters[i].connect(filters[i + 1]);
        }
        filters[filters.length - 1].connect(ctx.destination);

        window.ennizoEQ = filters;

        window.ennizoMedia.addEventListener("play", () => {
            if (ctx.state === "suspended") ctx.resume();
        });

        window.ennizoMedia.addEventListener("play", () => {
            if (!trimRegion) return;
            if (window.ennizoMedia.currentTime < trimRegion.start ||
                window.ennizoMedia.currentTime >= trimRegion.end) {
                window.ennizoMedia.currentTime = trimRegion.start;
            }
        });

        window.ennizoMedia.addEventListener("timeupdate", () => {
            if (!trimRegion) return;
            if (!window.ennizoMedia.paused && window.ennizoMedia.currentTime >= trimRegion.end) {
                window.ennizoMedia.pause();
            }
            });

        const sliders = document.querySelectorAll(".eq-slider")

        sliders.forEach((slider) => {

            slider.addEventListener("input", () => {

                const index = parseInt(slider.dataset.band);
                const gain = parseFloat(slider.value);
                filters[index].gain.value = gain;

            });

        });

    })();

    const regions = window.ennizoWave.registerPlugin(WaveSurfer.Regions.create());
    window.ennizoRegions = regions;

    function addInitialRegion() { 

        trimRegion = regions.addRegion({
            start: 0,
            end: window.ennizoWave.getDuration(),
            color: "rgba(139, 92, 246, 0.15)",   
            drag: true,
            resize: true,
            });

     }
    
    if (window.ennizoWave.getDuration() > 0) { addInitialRegion(); }
    else { window.ennizoWave.on("ready", addInitialRegion); }

    regions.on("region-updated", (region) => {
        console.log("trim", region.start, region.end);
        });

    const btn = document.getElementById("render-button");
    
    btn.addEventListener("click", () => {
        btn.disabled = true;
        btn.textContent = "Rendering…";
        const params = {
            trim_start: trimRegion ? trimRegion.start : null,
            trim_end: trimRegion ? trimRegion.end : null,
        };
        fetch("{% url 'processing:render_sample' sample.pk %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}",
            },
            body: JSON.stringify(params),
        }).then((resp) => {
            if (resp.ok) {
                window.location = "{% url 'analysis:sample_analysis' sample.pk %}";
            } else {
                btn.disabled = false;
                btn.textContent = "Confirm edit";
            }
        });
    });

  </script>

{% endblock %}
