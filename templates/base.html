{% load static %}
<!DOCTYPE html>
{# AI used to assist in overall structure of navigation bar with specific items self coded #}
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Ennizo{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
  </head>

  <body class="flex h-screen bg-background text-foreground overflow-hidden">

    <aside class="w-56 flex-shrink-0 border-r border-border flex flex-col py-6 px-3 bg-sidebar">

      <!-- Logo -->
      <div class="flex items-center gap-2.5 px-2 mb-7">
        <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round" class="text-white">
            <circle cx="8" cy="18" r="4"/><path d="M12 18V2l7 4"/>
          </svg>
        </div>
        <span class="text-base font-extrabold tracking-tight text-foreground">Ennizo</span>
      </div>

      <button class="flex items-center justify-center gap-2 mx-1 py-2.5 mb-3 bg-primary hover:bg-primary/90 text-white text-sm font-semibold rounded-xl transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus-icon lucide-plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          Post
        </button>

        <a href="#" class="flex items-center justify-center gap-2 mx-1 py-2.5 mb-6 text-sm font-semibold rounded-xl transition-colors border border-border text-muted-foreground hover:text-foreground hover:border-white/15">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-radio-icon lucide-radio"><path d="M16.247 7.761a6 6 0 0 1 0 8.478"/><path d="M19.075 4.933a10 10 0 0 1 0 14.134"/><path d="M4.925 19.067a10 10 0 0 1 0-14.134"/><path d="M7.753 16.239a6 6 0 0 1 0-8.478"/><circle cx="12" cy="12" r="2"/></svg>
          Record
        </a>

      <nav class="flex flex-col gap-0.5 flex-1">

        <a href="#"
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors
                  {% if active_page == 'feed' %}bg-primary/15 text-primary{% else %}text-muted-foreground hover:text-foreground hover:bg-white/[0.04]{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Feed
        </a>

        <a href="{% url 'library:index' %}"
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors
                  {% if active_page == 'library' %}bg-primary/15 text-primary{% else %}text-muted-foreground hover:text-foreground hover:bg-white/[0.04]{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" 
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-open-icon lucide-book-open"><path d="M12 5v16"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/></svg>
          Library
        </a>

        <a href="{% url 'accounts:profile' request.user.username %}"
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors
                  {% if active_page == 'profile' %}bg-primary/15 text-primary{% else %}text-muted-foreground hover:text-foreground hover:bg-white/[0.04]{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" 
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-icon lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Profile
        </a>

        <a href="#"
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors
                  {% if active_page == 'editor' %}bg-primary/15 text-primary{% else %}text-muted-foreground hover:text-foreground hover:bg-white/[0.04]{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-scissors-icon lucide-scissors"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/></svg>
          Editor
        </a>

      </nav>

      

      <div class="border-t border-sidebar-border pt-4 space-y-0.5">

  <button class="flex items-center gap-3 px-3 py-2.5 w-full rounded-xl text-sm text-muted-foreground hover:text-foreground hover:bg-white/[0.04] transition-colors">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" 
    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings-icon lucide-settings"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
    Settings
  </button>

    <div class="flex items-center gap-2.5 px-3 py-2 mt-1">
      <div class="w-7 h-7 rounded-full flex items-center justify-center font-bold text-white flex-shrink-0 select-none text-[10px]"
          style="background-color: #7c3aed;">YO</div>
      <div class="min-w-0">
        <div class="text-xs font-semibold text-foreground leading-tight truncate">Your Name</div>
        <div class="text-[10px] text-muted-foreground font-mono truncate">@yourhandle</div>
      </div>
    </div>

  </div>

</aside>

    <main class="flex-1 overflow-y-auto scrollbar-none">
      {% block content %}{% endblock %}
    </main>

  </body>
</html>
