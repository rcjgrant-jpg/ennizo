
<div id="draft-tags" class="space-y-2"
     hx-target="#draft-tags"
     hx-swap="outerHTML"
     hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

  <p class="text-muted-foreground text-xs uppercase tracking-wide">Tags</p>

  <div class="flex flex-wrap items-center gap-1.5">

    {% for st in sample.suggested_tags %}
      {% if st.pk == open_pk %}
        <span class="bg-primary/15 text-primary ring-primary/40 inline-flex items-center gap-2 rounded-full px-2.5 py-1 text-xs ring-1">
          {{ st.tag.name }}
          <button type="button" class="font-medium hover:underline"
                  hx-post="{% url 'social:draft_tags' post.pk %}"
                  hx-vals='{"action": "keep", "tag_pk": "{{ st.pk }}"}'>Keep</button>
          <button type="button" class="font-medium hover:underline"
                  hx-post="{% url 'social:draft_tags' post.pk %}"
                  hx-vals='{"action": "remove", "tag_pk": "{{ st.pk }}"}'>Remove</button>
        </span>
      {% else %}
        <button type="button"
                hx-get="{% url 'social:draft_tags' post.pk %}?open={{ st.pk }}"
                class="bg-primary/10 text-primary ring-primary/25 inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs ring-1">
          {{ st.tag.name }}
          <span class="opacity-60">suggested</span>
        </button>
      {% endif %}
    {% endfor %}

    {% for st in sample.accepted_tags %}
      {% if st.pk == open_pk %}
        <span class="bg-muted text-muted-foreground inline-flex items-center gap-2 rounded-full px-2.5 py-1 text-xs">
          {{ st.tag.name }}
          <button type="button" class="font-medium hover:underline"
                  hx-post="{% url 'social:draft_tags' post.pk %}"
                  hx-vals='{"action": "remove", "tag_pk": "{{ st.pk }}"}'>Remove</button>
        </span>
      {% else %}
        <button type="button"
                hx-get="{% url 'social:draft_tags' post.pk %}?open={{ st.pk }}"
                class="bg-muted text-muted-foreground rounded-full px-2.5 py-1 text-xs">
          {{ st.tag.name }}
        </button>
      {% endif %}
    {% endfor %}

    {% if adding %}
      <span id="tag-add" class="bg-muted inline-flex items-center gap-2 rounded-full px-2.5 py-1 text-xs">
        <input type="text" name="tag_name" placeholder="new tag" autocomplete="off" autofocus
               hx-on::load="this.focus()"
               onkeydown="if(event.key==='Enter'){event.preventDefault();}"
               class="text-foreground w-24 bg-transparent outline-none">
        <button type="button" class="text-primary font-medium hover:underline"
                hx-post="{% url 'social:draft_tags' post.pk %}"
                hx-vals='{"action": "add"}'
                hx-include="#tag-add">Add</button>
        <button type="button" title="Cancel" class="text-muted-foreground hover:text-foreground"
                hx-get="{% url 'social:draft_tags' post.pk %}">&times;</button>
      </span>
    {% else %}
      <button type="button" title="Add a tag"
              hx-get="{% url 'social:draft_tags' post.pk %}?adding=1"
              class="border-border text-muted-foreground hover:text-foreground inline-flex h-6 w-6 items-center justify-center rounded-full border border-dashed text-sm leading-none">+</button>
    {% endif %}

  </div>
</div>
