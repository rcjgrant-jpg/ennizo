 <div id="composer-attach"
     class="border-border mt-3 space-y-3 border-t pt-3"
     {% if metadata.is_running %}
       hx-get="{% url 'social:draft_state' post.pk %}"
       hx-trigger="every 2s"
       hx-target="#composer-attach"
       hx-swap="outerHTML"
     {% endif %}>

  <input type="hidden" name="draft_pk" value="{{ post.pk }}" form="composer-form">

  <div class="flex items-center justify-between">
    <p class="text-xs font-medium">{{ sample.title }}</p>
    <button type="button"
            hx-post="{% url 'social:discard_draft' %}"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
            hx-target="#composer-attach"
            hx-swap="outerHTML"
            class="text-muted-foreground text-xs hover:underline">
      Replace
    </button>
  </div>

  {% include "analysis/_analysis_state.html" %}

  {% comment %}Withheld while analysis runs: the 2s poll replaces this whole
  region, which would wipe a half-typed tag.{% endcomment %}
  {% if not metadata.is_running %}
    {% include "social/partials/draft_tags.html" %}
  {% endif %}

</div>
