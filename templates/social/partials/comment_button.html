<button type="button"
        id="comment-btn-{{ post.pk }}"
        {% if oob %}hx-swap-oob="true"{% endif %}
        hx-get="{% url 'social:post_comments' post.pk %}"
        hx-target="#comments-{{ post.pk }}"
        hx-swap="innerHTML"
        class="text-muted-foreground hover:bg-muted flex items-center gap-1.5 rounded-md px-2.5 py-1.5 text-xs">
  <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none"
       stroke="currentColor" stroke-width="1.7"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12c0 4.418-4.03 8-9 8a9.9 9.9 0 0 1-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
  </svg>
  <span>{{ comment_count }}</span>
  <span class="sr-only">Show comments</span>
</button>
