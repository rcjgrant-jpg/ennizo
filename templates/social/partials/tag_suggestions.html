{% if suggestions %}
  <div class="bg-card border-border rounded-lg border p-2 shadow-lg">
    <p class="text-muted-foreground px-1 pb-1.5 text-xs">
      Tags matching &ldquo;{{ query }}&rdquo;
    </p>
    <div class="flex flex-wrap gap-1.5">
      {% for suggestion in suggestions %}
        <a href="{{ suggestion.add_url }}"
           hx-get="{{ suggestion.add_url }}"
           hx-target="#feed-root"
           hx-swap="outerHTML"
           hx-push-url="true"
           class="bg-muted hover:bg-primary hover:text-primary-foreground inline-flex items-center gap-1.5 rounded-md px-2.5 py-1.5 text-xs transition-colors">
          <span class="font-medium">#{{ suggestion.name }}</span>
          <span class="text-muted-foreground text-[0.65rem]">{{ suggestion.post_count }}</span>
        </a>
      {% endfor %}
    </div>
  </div>
{% elif query %}
  <div class="bg-card border-border rounded-lg border px-3 py-2 shadow-lg">
    <p class="text-muted-foreground text-xs">No tags matching &ldquo;{{ query }}&rdquo;.</p>
  </div>
{% endif %}
