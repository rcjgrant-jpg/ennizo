
<ul class="mt-2 space-y-1" id="pw-rules" data-input="{{ input_id }}">
  <li class="text-muted-foreground flex items-center gap-1.5 text-xs" data-rule="length">
    <svg viewBox="0 0 24 24" class="h-3.5 w-3.5 shrink-0" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle class="rule-idle" cx="12" cy="12" r="9" stroke-width="2"/>
      <path class="rule-done hidden" d="M20 6 9 17l-5-5"/>
    </svg>
    At least 8 characters
  </li>
  <li class="text-muted-foreground flex items-center gap-1.5 text-xs" data-rule="digits">
    <svg viewBox="0 0 24 24" class="h-3.5 w-3.5 shrink-0" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle class="rule-idle" cx="12" cy="12" r="9" stroke-width="2"/>
      <path class="rule-done hidden" d="M20 6 9 17l-5-5"/>
    </svg>
    At least 2 numbers
  </li>
  <li class="text-muted-foreground flex items-center gap-1.5 text-xs" data-rule="special">
    <svg viewBox="0 0 24 24" class="h-3.5 w-3.5 shrink-0" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle class="rule-idle" cx="12" cy="12" r="9" stroke-width="2"/>
      <path class="rule-done hidden" d="M20 6 9 17l-5-5"/>
    </svg>
    At least 1 special character
  </li>
</ul>

<script>
  (function () {
    const list = document.getElementById("pw-rules");
    const input = document.getElementById(list.dataset.input);
    const rules = {
      length:  (v) => v.length >= 8,
      digits:  (v) => (v.match(/\d/g) || []).length >= 2,
      special: (v) => /[^A-Za-z0-9]/.test(v),
    };
    input.addEventListener("input", function () {
      const v = input.value;
      for (const [name, test] of Object.entries(rules)) {
        const li = list.querySelector(`[data-rule="${name}"]`);
        const done = test(v);
        li.classList.toggle("text-primary", done);
        li.classList.toggle("text-muted-foreground", !done);
        li.querySelector(".rule-idle").classList.toggle("hidden", done);
        li.querySelector(".rule-done").classList.toggle("hidden", !done);
      }
    });
  })();
</script>
