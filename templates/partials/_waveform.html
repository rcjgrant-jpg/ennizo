{# Waveform player. Pure display: expects `sample` and analysed `metadata`.   #}
{# Optional flag `with_media`: when true, backs WaveSurfer with an <audio>    #}
{# element exposed as window.ennizoMedia so the page can route it through a   #}
{# Web Audio graph (used by the editor's EQ). Default (absent/false) keeps    #}
{# the original self-contained behaviour for the analysis page.               #}

{{ metadata.peaks|json_script:"peaks-data" }}

<div class="rounded-xl border border-white/10 bg-white/5 p-5">
  <div id="waveform" data-audio="{{ sample.audio_file.url }}"></div>
  <div class="mt-4 flex items-center gap-4">
    <button id="wave-play" type="button"
            class="rounded-lg bg-white/10 px-4 py-2 text-sm hover:bg-white/20">Play</button>
    <span class="text-sm text-white/50">{{ metadata.duration_display }}</span>
  </div>
</div>

<script>
  (function () {
    const container = document.getElementById("waveform");
    const peaksEl = document.getElementById("peaks-data");
    if (!container || !peaksEl || !window.WaveSurfer) return;

    if (window.ennizoWave) { window.ennizoWave.destroy(); }
    if (window.ennizoMedia) { window.ennizoMedia.remove(); window.ennizoMedia = null; }

    const options = {
      container: container,
      peaks: [JSON.parse(peaksEl.textContent)],
      duration: {{ metadata.duration_seconds|default:0 }},
      height: 96,
      waveColor: "rgba(255,255,255,0.35)",
      progressColor: "#8b5cf6",
      cursorColor: "rgba(255,255,255,0.6)",
      barWidth: 2,
      barGap: 1,
      barRadius: 2,
    };

    {% if with_media %}
      const media = new Audio();
      media.crossOrigin = "anonymous";
      media.src = container.dataset.audio;
      window.ennizoMedia = media;
      options.media = media;
    {% else %}
      options.url = container.dataset.audio;
    {% endif %}

    window.ennizoWave = WaveSurfer.create(options);

    const button = document.getElementById("wave-play");
    if (button) {
      button.addEventListener("click", () => window.ennizoWave.playPause());
      window.ennizoWave.on("play", () => button.textContent = "Pause");
      window.ennizoWave.on("pause", () => button.textContent = "Play");
    }
  })();
</script>
