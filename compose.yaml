# Runs the production image locally, wired to throwaway Postgres and Redis
# containers. Purpose: prove the Dockerfile builds and the app boots on Linux
# *before* involving Render. Not for day-to-day development — keep using the
# three-terminal setup for that.
#
#   docker compose up --build
#   open http://localhost:8000
#
# Media stays on local disk here unless you put bucket credentials in
# .env.docker, which is the way to test the S3 path end-to-end.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ennizo
      POSTGRES_USER: ennizo
      POSTGRES_PASSWORD: ennizo
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy noeviction

  # platform: linux/amd64 on web and worker is required on Apple Silicon Macs.
  # The pinned Essentia build has no Linux ARM wheel, and Render runs x86_64
  # anyway, so we build the same architecture that will deploy. Docker Desktop
  # emulates it; expect the build and audio analysis to be slower than native.
  web:
    build: .
    platform: linux/amd64
    env_file: .env.docker
    environment:
      DATABASE_URL: postgres://ennizo:ennizo@db:5432/ennizo
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on: [db, redis]
    volumes:
      - media:/app/media
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"

  worker:
    build: .
    platform: linux/amd64
    env_file: .env.docker
    environment:
      DATABASE_URL: postgres://ennizo:ennizo@db:5432/ennizo
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
    volumes:
      - media:/app/media
    command: celery -A config worker -B --loglevel=info --concurrency=1

volumes:
  pgdata:
  media: