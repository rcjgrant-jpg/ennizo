# Render Blueprint for Ennizo.
# Render > New > Blueprint, point it at the repo; it creates everything below.
#
# Plan names and prices change — treat the `plan:` values as starting points
# and check Render's current pricing page. The worker is the memory-hungry
# process (librosa + Essentia + pedalboard load at import time), so it gets
# the larger plan; the web process only serves pages and enqueues jobs.
#
# Four values are secrets Render cannot generate: the bucket credentials.
# `sync: false` makes the dashboard prompt for them on first deploy.

services:
  # ---------------------------------------------------------------- web ----
  - type: web
    name: ennizo-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /accounts/login/
    # Runs once per deploy, before the new version receives traffic.
    preDeployCommand: python manage.py migrate --noinput
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: ennizo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ennizo-redis
          property: connectionString
      # --- media bucket (S3 or Cloudflare R2) ---
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false          # R2: https://<account-id>.r2.cloudflarestorage.com ; leave empty for AWS
      - key: AWS_S3_REGION_NAME
        sync: false          # R2: auto ; AWS: e.g. eu-west-2

  # ------------------------------------------------------------- worker ----
  # Single worker with embedded beat (-B). Acceptable because there is exactly
  # one worker; two would each run the reaper. --concurrency=1 keeps memory
  # to one copy of the audio libraries.
  - type: worker
    name: ennizo-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A config worker -B --loglevel=info --concurrency=1
    plan: standard
    region: frankfurt
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        fromService:
          type: web
          name: ennizo-web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: ennizo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ennizo-redis
          property: connectionString
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false

  # -------------------------------------------------------------- redis ----
  - type: keyvalue
    name: ennizo-redis
    plan: free
    region: frankfurt
    ipAllowList: []          # internal access only
    maxmemoryPolicy: noeviction   # a broker must never drop queued jobs

databases:
  - name: ennizo-db
    plan: free               # free Postgres expires after a set period; fine for the assessment window
    region: frankfurt
    databaseName: ennizo
    user: ennizo
